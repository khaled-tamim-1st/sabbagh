kind = "web"
previewPath = "/"
title = "صباغ الكويت"
description = "سوق إلكتروني عربي يربط العملاء بالصباغين في الكويت. يتيح تصفح مقدمي الخدمة، مقارنة التقييمات والخدمات، واستكشاف عروض الصباغة بتجربة مصممة أساسًا للهواتف."
version = "1.0.0"
id = "artifacts/sabbagh-kuwait"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18259

[services.development]
run = "pnpm --filter @workspace/sabbagh-kuwait run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sabbagh-kuwait", "run", "build" ]
serve = "static"
publicDir = "artifacts/sabbagh-kuwait/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18259"
BASE_PATH = "/"
